<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cercanías Orduña & IA</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon-512.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f2f2f7; display: flex; flex-direction: column; height: 100dvh; }
    
    header { background: #ffffff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e5ea; }
    header span { font-weight: 600; font-size: 17px; }
    .key-btn { background: none; border: none; font-size: 20px; cursor: pointer; }

    /* Tarjeta de Tiempos de Tren */
    #train-card {
      background: #ffffff;
      margin: 12px 16px 0 16px;
      padding: 14px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .train-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #8e8e93; font-weight: 600; }
    .train-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .train-box { background: #f8f9fa; border: 1px solid #e5e5ea; border-radius: 10px; padding: 10px; text-align: center; }
    .train-label { font-size: 11px; text-transform: uppercase; color: #6c757d; font-weight: bold; margin-bottom: 4px; }
    .train-time { font-size: 20px; font-weight: 700; color: #007aff; }
    .train-countdown { font-size: 12px; color: #34c759; font-weight: 600; margin-top: 2px; }

    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    
    .bubble { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-break: break-word; }
    .user { align-self: flex-end; background-color: #007aff; color: white; border-bottom-right-radius: 4px; }
    .ai { align-self: flex-start; background-color: #e5e5ea; color: black; border-bottom-left-radius: 4px; }
    
    #input-area { background: #ffffff; padding: 12px; display: flex; gap: 8px; border-top: 1px solid #e5e5ea; }
    input { flex: 1; padding: 12px; border: 1px solid #d1d1d6; border-radius: 20px; font-size: 16px; outline: none; }
    #sendBtn { background: #007aff; color: white; border: none; border-radius: 20px; padding: 0 18px; font-weight: 600; cursor: pointer; }
    #sendBtn:disabled { background: #a2a2a7; }
  </style>
</head>
<body>

  <header>
    <span>C-3 Cercanías Orduña</span>
    <button class="key-btn" onclick="configureApiKey()" title="Configurar API Key">⚙️</button>
  </header>

  <!-- Panel de tiempos de tren -->
  <div id="train-card">
    <div class="train-header">
      <span>ESTACIÓN DE ORDUÑA</span>
      <span id="current-clock">--:--</span>
    </div>
    <div class="train-grid">
      <div class="train-box">
        <div class="train-label">Próxima Salida (a Bilbao)</div>
        <div class="train-time" id="next-departure">--:--</div>
        <div class="train-countdown" id="dep-countdown">calculando...</div>
      </div>
      <div class="train-box">
        <div class="train-label">Próxima Llegada (de Bilbao)</div>
        <div class="train-time" id="next-arrival">--:--</div>
        <div class="train-countdown" id="arr-countdown">calculando...</div>
      </div>
    </div>
  </div>

  <div id="chat-container">
    <div class="bubble ai">¡Hola! Arriba tienes los tiempos en directo del Cercanías en Orduña. También puedes preguntarme dudas sobre rutas o transbordos.</div>
  </div>

  <div id="input-area">
    <input type="text" id="userInput" placeholder="Pregunta sobre trenes o cualquier tema..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    // 1. Registro del Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(console.error);
      });
    }

    // 2. Horarios regulares de Cercanías C3 (Orduña)
    // Salidas desde Orduña hacia Bilbao Abando
    const departuresFromOrduna = [
      "05:01", "05:31", "06:12", "06:34", "07:01", "07:29", "08:01", "08:31",
      "09:01", "09:31", "10:01", "10:31", "10:58", "11:30", "12:01", "12:31",
      "13:04", "13:31", "13:59", "14:34", "15:06", "15:33", "16:01", "16:31",
      "17:01", "17:31", "18:01", "18:31", "19:01", "19:31", "20:01", "20:31",
      "21:01", "21:31", "22:01", "22:31"
    ];

    // Llegadas a Orduña (salen de Bilbao Abando ~1h antes)
    const arrivalsAtOrduna = [
      "06:00", "06:32", "07:02", "07:35", "08:02", "08:32", "09:02", "09:32",
      "10:02", "10:32", "11:02", "11:32", "12:00", "12:31", "13:02", "13:32",
      "14:05", "14:32", "15:00", "15:35", "16:07", "16:32", "17:02", "17:32",
      "18:02", "18:32", "19:02", "19:32", "20:02", "20:32", "21:02", "21:32",
      "22:02", "22:32", "23:02", "23:35"
    ];

    function timeToMinutes(timeStr) {
      const [h, m] = timeStr.split(":").map(Number);
      return h * 60 + m;
    }

    function updateTrainTimes() {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      document.getElementById("current-clock").textContent = 
        String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

      // Buscar siguiente salida
      const nextDep = departuresFromOrduna.find(t => timeToMinutes(t) >= currentMinutes);
      if (nextDep) {
        const diff = timeToMinutes(nextDep) - currentMinutes;
        document.getElementById("next-departure").textContent = nextDep;
        document.getElementById("dep-countdown").textContent = diff === 0 ? "¡Saliendo ya!" : `en ${diff} min`;
      } else {
        document.getElementById("next-departure").textContent = departuresFromOrduna[0];
        document.getElementById("dep-countdown").textContent = "Mañana";
      }

      // Buscar siguiente llegada
      const nextArr = arrivalsAtOrduna.find(t => timeToMinutes(t) >= currentMinutes);
      if (nextArr) {
        const diff = timeToMinutes(nextArr) - currentMinutes;
        document.getElementById("next-arrival").textContent = nextArr;
        document.getElementById("arr-countdown").textContent = diff === 0 ? "¡Llegando!" : `en ${diff} min`;
      } else {
        document.getElementById("next-arrival").textContent = arrivalsAtOrduna[0];
        document.getElementById("arr-countdown").textContent = "Mañana";
      }
    }

    // Actualizar tiempos cada segundo
    updateTrainTimes();
    setInterval(updateTrainTimes, 10000);

    // 3. Gestión de API Key y Chat IA
    function getStoredApiKey() {
      return localStorage.getItem("gemini_user_api_key");
    }

    function configureApiKey() {
      const currentKey = getStoredApiKey() || "";
      const newKey = prompt("Introduce tu Gemini API Key:", currentKey);
      if (newKey !== null) {
        if (newKey.trim() === "") {
          localStorage.removeItem("gemini_user_api_key");
          alert("API Key eliminada.");
        } else {
          localStorage.setItem("gemini_user_api_key", newKey.trim());
          alert("API Key guardada con éxito.");
        }
      }
    }

    async function sendMessage() {
      let apiKey = getStoredApiKey();
      if (!apiKey) {
        configureApiKey();
        apiKey = getStoredApiKey();
        if (!apiKey) return;
      }

      const input = document.getElementById("userInput");
      const btn = document.getElementById("sendBtn");
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      input.value = "";
      btn.disabled = true;

      const loadingMsg = appendMessage("Consultando...", "ai");

      // Contexto inyectado a la IA sobre la estación
      const contextPrompt = `Contexto: El usuario está en la estación de tren de Orduña (Línea C3 Cercanías Bilbao). Hora actual: ${document.getElementById("current-clock").textContent}. Siguiente salida a Bilbao: ${document.getElementById("next-departure").textContent}. Siguiente llegada: ${document.getElementById("next-arrival").textContent}. Pregunta: ${text}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: contextPrompt }] }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          loadingMsg.textContent = data.candidates[0].content.parts[0].text;
        } else if (data.error) {
          loadingMsg.textContent = "Error de API: " + data.error.message;
        } else {
          loadingMsg.textContent = "Error al recibir la respuesta.";
        }
      } catch (err) {
        loadingMsg.textContent = "Error de red o conexión.";
      } finally {
        btn.disabled = false;
      }
    }

    function appendMessage(text, sender) {
      const chat = document.getElementById("chat-container");
      const bubble = document.createElement("div");
      bubble.className = `bubble ${sender}`;
      bubble.textContent = text;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }
  </script>
</body>
</html>
