<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radio Player • Time-Shift</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon-512.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background-color: #f2f2f7; 
      display: flex; 
      flex-direction: column; 
      min-height: 100dvh; 
    }
    
    header { 
      background: #ffffff; 
      padding: 14px 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid #e5e5ea; 
      position: sticky; 
      top: 0; 
      z-index: 10; 
    }
    header span { 
      font-weight: 700; 
      font-size: 17px; 
      color: #1c1c1e; 
    }

    #main-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px 14px;
      flex: 1;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .app-card {
      background: #ffffff;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 13px; 
      color: #8e8e93; 
      font-weight: bold; 
      margin-bottom: 14px; 
    }

    .radio-controls { 
      display: flex; 
      gap: 10px; 
      align-items: center; 
      margin-bottom: 16px; 
    }

    select { 
      flex: 1; 
      padding: 12px; 
      border-radius: 10px; 
      border: 1px solid #d1d1d6; 
      font-size: 15px; 
      background: #f8f9fa; 
      outline: none; 
    }

    .radio-btn { 
      background: #007aff; 
      color: white; 
      border: none; 
      border-radius: 10px; 
      padding: 12px 18px; 
      font-weight: 600; 
      font-size: 15px; 
      cursor: pointer; 
      white-space: nowrap; 
      transition: background 0.2s ease;
    }

    .delay-container {
      background: #f8f9fa;
      border: 1px solid #e5e5ea;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .delay-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 13px; 
      font-weight: 600; 
      color: #333; 
    }

    .delay-slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #d1d1d6;
      outline: none;
      -webkit-appearance: none;
    }

    .delay-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #007aff;
      cursor: pointer;
    }

    .delay-scale {
      display: flex; 
      justify-content: space-between; 
      font-size: 11px; 
      color: #8e8e93; 
    }
  </style>
</head>
<body>

  <header>
    <span>Radio Streaming • Time-Shift</span>
  </header>

  <div id="main-container">
    <div class="app-card">
      <div class="card-header">
        <span>📻 EMISORAS DISPONIBLES</span>
        <span id="radio-status" style="color:#007aff;">Detenido</span>
      </div>
      
      <div class="radio-controls">
        <select id="station-select">
          <option value="">Selecciona emisora...</option>
          <option value="https://media-ice.musicradio.com/SmoothUKMP3">Smooth UK</option>
          <option value="https://media-ice.musicradio.com/GoldMP3">Gold</option>
          <option value="https://media-ice.musicradio.com/LBCLondonMP3Low">LBC London</option>
          <option value="https://radio.virginradio.co.uk/stream">Virgin Radio</option>
          <option value="https://media-ice.musicradio.com/CapitalMP3">Capital FM</option>
          <option value="https://nerbioi.radiopopular.eus/bizkaiairratia2">Bizkaia Irratia</option>
          <option value="https://online.arrateirratia.eus/zuzenean">Arrate Irratia</option>
          <option value="https://fm939.wnyc.org/wnycfm">NPR News</option>
          <option value="https://stream.live.vc.bbcmedia.co.uk/bbc_world_service">BBC News</option>
          <option value="https://cdn-peer022.streaming-pro.com:6133/radionervion.aac">Radio Nervion</option>
          <option value="https://srv7021.dns-lcinternet.com/8072/stream">Radio Merindades</option>
        </select>
        <button id="radio-btn" class="radio-btn" onclick="togglePlayRadio()">▶ Oír</button>
      </div>

      <!-- Time-Shift buffer control (0 to 120 seconds) -->
      <div class="delay-container">
        <div class="delay-header">
          <span>⏱️ Retardo de audio:</span>
          <span id="delay-value" style="color: #007aff; font-weight: bold;">0 segundos (Directo)</span>
        </div>
        <input 
          type="range" 
          id="delay-slider" 
          class="delay-slider" 
          min="0" 
          max="120" 
          value="0" 
          step="1" 
          oninput="handleDelayInput(this.value)"
        >
        <div class="delay-scale">
          <span>0s (Directo)</span>
          <span>60s</span>
          <span>120s (2 min)</span>
        </div>
      </div>

      <audio id="audio-player" preload="none"></audio>
    </div>
  </div>

  <script>
    // 1. Service Worker registration for offline PWA shell
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(console.error);
      });
    }

    // 2. Audio Player & Time-Shift logic
    const player = document.getElementById("audio-player");
    const radioBtn = document.getElementById("radio-btn");
    const radioStatus = document.getElementById("radio-status");
    const stationSelect = document.getElementById("station-select");
    const delayValueLabel = document.getElementById("delay-value");

    let currentDelay = 0;
    let delayTimer = null;

    function handleDelayInput(val) {
      const targetSec = parseInt(val, 10);
      delayValueLabel.textContent = targetSec === 0 ? "0 segundos (Directo)" : `${targetSec} segundo${targetSec > 1 ? 's' : ''}`;

      if (targetSec === 0) {
        if (delayTimer) {
          clearInterval(delayTimer);
          delayTimer = null;
        }
        currentDelay = 0;
        if (player.seekable && player.seekable.length > 0) {
          player.currentTime = player.seekable.end(player.seekable.length - 1);
        }
        if (!player.paused) radioStatus.textContent = "En directo 🔴";
        return;
      }

      if (!player.paused && targetSec > currentDelay) {
        const additionalWait = targetSec - currentDelay;
        player.pause();

        let remaining = additionalWait;
        radioStatus.textContent = `Sincronizando delay (${remaining}s)...`;

        if (delayTimer) clearInterval(delayTimer);

        delayTimer = setInterval(() => {
          remaining--;
          if (remaining > 0) {
            radioStatus.textContent = `Sincronizando delay (${remaining}s)...`;
          } else {
            clearInterval(delayTimer);
            delayTimer = null;
            currentDelay = targetSec;
            player.play().then(() => {
              radioStatus.textContent = `En diferido (-${currentDelay}s) 🟡`;
            }).catch(console.error);
          }
        }, 1000);
      } else {
        currentDelay = targetSec;
        if (!player.paused) {
          radioStatus.textContent = `En diferido (-${currentDelay}s) 🟡`;
        }
      }
    }

    async function togglePlayRadio() {
      const url = stationSelect.value;
      if (!url) {
        alert("Selecciona primero una emisora de la lista.");
        return;
      }

      if (delayTimer) {
        clearInterval(delayTimer);
        delayTimer = null;
      }

      if (player.paused) {
        radioBtn.textContent = "⌛ Conectando...";
        radioBtn.disabled = true;
        radioStatus.textContent = "Conectando stream...";

        if (player.src !== url) {
          player.src = url;
          player.load();
        }

        try {
          await player.play();
          radioBtn.textContent = "⏸ Pausar";
          radioBtn.style.background = "#ff3b30";
          radioBtn.disabled = false;

          if (currentDelay > 0) {
            handleDelayInput(currentDelay);
          } else {
            radioStatus.textContent = "En directo 🔴";
          }
        } catch (err) {
          console.error("Error al iniciar reproducción:", err);
          radioBtn.textContent = "▶ Oír";
          radioBtn.style.background = "#007aff";
          radioBtn.disabled = false;
          radioStatus.textContent = "Error de emisión";
          alert("No se pudo reproducir este stream en tu dispositivo.");
        }
      } else {
        player.pause();
        radioBtn.textContent = "▶ Oír";
        radioBtn.style.background = "#007aff";
        radioStatus.textContent = "En pausa";
      }
    }

    stationSelect.addEventListener("change", () => {
      if (delayTimer) {
        clearInterval(delayTimer);
        delayTimer = null;
      }
      player.pause();
      player.src = stationSelect.value;
      radioBtn.textContent = "▶ Oír";
      radioBtn.style.background = "#007aff";
      radioStatus.textContent = "Lista";
      currentDelay = 0;
      document.getElementById("delay-slider").value = 0;
      delayValueLabel.textContent = "0 segundos (Directo)";
    });
  </script>
</body>
</html>
