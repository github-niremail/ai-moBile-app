<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini AI Mobile</title>

  <!-- Enlace al Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Configuración para Android / Chrome -->
  <meta name="theme-color" content="#007aff">

  <!-- Configuración para iOS / Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI App">
  <link rel="apple-touch-icon" href="/icon-512.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f2f2f7; display: flex; flex-direction: column; height: 100dvh; }
    
    header { background: #ffffff; padding: 16px; text-align: center; font-weight: 600; border-bottom: 1px solid #e5e5ea; }
    
    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    
    .bubble { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-break: break-word; }
    .user { align-self: flex-end; background-color: #007aff; color: white; border-bottom-right-radius: 4px; }
    .ai { align-self: flex-start; background-color: #e5e5ea; color: black; border-bottom-left-radius: 4px; }
    
    #input-area { background: #ffffff; padding: 12px; display: flex; gap: 8px; border-top: 1px solid #e5e5ea; }
    input { flex: 1; padding: 12px; border: 1px solid #d1d1d6; border-radius: 20px; font-size: 16px; outline: none; }
    button { background: #007aff; color: white; border: none; border-radius: 20px; padding: 0 18px; font-weight: 600; cursor: pointer; }
    button:disabled { background: #a2a2a7; }
  </style>
</head>
<body>

  <header>Gemini PWA</header>

  <div id="chat-container">
    <div class="bubble ai">¡Hola! Soy tu asistente de bolsillo. ¿En qué te ayudo hoy?</div>
  </div>

  <div id="input-area">
    <input type="text" id="userInput" placeholder="Escribe un mensaje..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    // 1. Registro del Service Worker para funcionamiento PWA
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js")
          .then((reg) => console.log("PWA Service Worker registrado con éxito:", reg.scope))
          .catch((err) => console.error("Fallo al registrar Service Worker:", err));
      });
    }

    // 2. Lógica de la IA
    const API_KEY = "TU_API_KEY_DE_GEMINI_AQUI";

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const btn = document.getElementById("sendBtn");
      const text = input.value.trim();
      
      if (!text) return;

      appendMessage(text, "user");
      input.value = "";
      btn.disabled = true;

      const loadingMsg = appendMessage("Pensando...", "ai");

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: text }] }]
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          loadingMsg.textContent = data.candidates[0].content.parts[0].text;
        } else {
          loadingMsg.textContent = "Error: Respuesta vacía o clave de API no válida.";
        }
      } catch (err) {
        loadingMsg.textContent = "Error al conectar con la IA. Comprueba tu conexión.";
      } finally {
        btn.disabled = false;
      }
    }

    function appendMessage(text, sender) {
      const chat = document.getElementById("chat-container");
      const bubble = document.createElement("div");
      bubble.className = `bubble ${sender}`;
      bubble.textContent = text;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }
  </script>
</body>
</html>
